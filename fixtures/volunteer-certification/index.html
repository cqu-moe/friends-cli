<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>志愿认证受控页面</title>
<style>body{font:16px system-ui;margin:25px}.van-cell{display:flex;gap:20px;margin:10px}.name-list .list-group{padding:20px;border:1px solid #ccc}.van-popup,.set-form{display:none;background:white;padding:20px;border:2px solid #ccc;position:fixed;inset:30px;z-index:2}.van-popup--right{z-index:3}.van-popup--bottom{z-index:4}.open{display:block}button{padding:10px;margin:6px}input{padding:10px}.van-checkbox{cursor:pointer}.hours{padding:10px}</style>
<div class="cmine">
 <div class="van-cell"><div class="van-cell__title">活动名称</div><div class="van-cell__value">迎新志愿服务</div></div>
 <div class="van-cell"><div class="van-cell__title">组织单位</div><div class="van-cell__value">示例青协</div></div>
 <div class="van-cell"><div class="van-cell__title">认证方式</div><div class="van-cell__value">签到+签退</div></div>
 <button id="add">添加名单</button><button id="all">全部认证</button>
 <div class="name-list"><div class="van-checkbox-group" id="roster"></div></div>
 <button id="submit">提交认证</button>
</div>
<div class="set-form" id="add-form">
 <div class="van-cell"><div class="van-cell__title">学号</div><div class="van-cell__value" id="student-number"></div></div>
 <div class="van-cell"><div class="van-cell__title">姓名</div><div class="van-cell__value" id="student-name"></div></div>
 <div class="field-select"><input name="postId" placeholder="请选择"></div>
 <input name="requiredCourseCount" placeholder="请输入">
 <div class="footer"><button>保存</button></div>
</div>
<div class="van-popup van-popup--right" id="search">
 <input placeholder="学号/姓名"><div class="van-search__action">搜索</div><div class="page-list"></div>
 <div class="search-footer"><div class="back">返回</div><div class="confirm">确定</div></div>
</div>
<div class="van-popup van-popup--center" id="edit">
 <div class="field-select"><input name="date"></div><input name="requiredCourseCount">
 <div class="save"><button>保存</button></div>
</div>
<div class="van-popup van-popup--bottom" id="picker"><div class="van-picker"><div class="van-picker-column__item" role="button">引导岗</div><button class="van-picker__confirm">确认</button></div></div>
<script>
const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];
const rows=[{no:'20210001',name:'示例学生',hours:2,selected:false,post:'引导岗'}];
let pending=null,editing=null,postInput=null;
function render(){const root=$('#roster');root.replaceChildren();for(const row of rows){const e=document.createElement('div');e.className='van-cell-group list-group';e.innerHTML='<div class="van-checkbox user-name" role="checkbox"><span></span><span>示例学院</span></div><div class="hours"><span>时长</span><span></span></div><button>设置时长</button>';e.querySelector('.user-name span').textContent=row.name;const check=e.querySelector('[role=checkbox]');check.setAttribute('aria-checked',String(row.selected));check.onclick=()=>{row.selected=!row.selected;check.setAttribute('aria-checked',String(row.selected));};e.querySelector('.hours span:last-child').textContent=row.hours??'';e.querySelector('button').onclick=()=>{editing=row;$('#edit input[name=date]').value=row.post;$('#edit input[name=requiredCourseCount]').value=row.hours??'';$('#edit').classList.add('open');};root.append(e);}}
$('#add').onclick=()=>{$('#add-form').classList.add('open');$('#search').classList.add('open');$('#search input').value='';$('.page-list').replaceChildren();};
$('.van-search__action').onclick=()=>{const no=$('#search input').value;if(no!=='20210002')return;pending={no,name:'示例志愿者',selected:true,post:'',hours:null};$('.page-list').innerHTML='<div class="stu-info"><div role="checkbox" aria-checked="false">选择</div><span class="stu-name">示例志愿者 / 示例学院 2021级 本科</span></div>';$('.stu-info [role=checkbox]').onclick=e=>e.target.setAttribute('aria-checked','true');};
$('.search-footer .confirm').onclick=()=>{if(!pending||$('.stu-info [role=checkbox]').getAttribute('aria-checked')!=='true')return;$('#student-number').textContent=pending.no;$('#student-name').textContent=pending.name;$('#search').classList.remove('open');};
$('.search-footer .back').onclick=()=>{$('#search').classList.remove('open');$('#add-form').classList.remove('open');};
for(const input of all('.field-select input'))input.onclick=()=>{postInput=input;$('#picker').classList.add('open');};
$('.van-picker-column__item').onclick=()=>{};
$('.van-picker__confirm').onclick=()=>{postInput.value='引导岗';$('#picker').classList.remove('open');};
$('#add-form .footer button').onclick=()=>{if(!pending||!$('#add-form input[name=postId]').value)return;pending.post=$('#add-form input[name=postId]').value;pending.hours=Number($('#add-form input[name=requiredCourseCount]').value);rows.push(pending);pending=null;$('#add-form').classList.remove('open');render();};
$('#edit .save button').onclick=()=>{editing.post=$('#edit input[name=date]').value;editing.hours=Number($('#edit input[name=requiredCourseCount]').value);$('#edit').classList.remove('open');render();};
$('#submit').onclick=()=>fetch('/mob/school-activity-attestation-apply/apply',{method:'POST',body:JSON.stringify(rows)});
$('#all').onclick=()=>{rows.forEach(row=>row.selected=true);render();};
render();
</script></html>
